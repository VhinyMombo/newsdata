<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#7A1F2B" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- "default" (opaque) rather than "black-translucent": the latter lets
    page content render under the status bar, which needs matching
    safe-area-inset CSS we don't have — without it the header overlaps the
    clock/battery icons in standalone mode. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Kiosque" />
    <title>Le Kiosque</title>
    <meta name="description" content="La presse et les lois, à portée de question. Plus de 26 000 articles de 13 journaux, mis à jour toutes les heures, et les codes de loi du Journal officiel. Posez une question : l'assistant répond en citant ses sources." />
    <!-- Link previews (WhatsApp, Facebook, Messenger, X): the image keeps its mark and
    name in the centre, since WhatsApp crops it to a square for small previews -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Le Kiosque" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:url" content="https://lekiosque.hodologic.fr/" />
    <meta property="og:title" content="Le Kiosque : la presse et les lois, à portée de question" />
    <meta property="og:description" content="Plus de 26 000 articles de 13 journaux, mis à jour toutes les heures, et les codes de loi du Journal officiel. Posez une question : l'assistant répond en citant ses sources." />
    <meta property="og:image" content="https://lekiosque.hodologic.fr/og-kiosque-v2.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Le Kiosque, la presse et les lois à portée de question" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Fonts requested from the start, so the splash wordmark is already in Newsreader -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Hanken+Grotesk:wght@400;500;600&display=swap" />
    <!-- Launch screens for the installed app on iPhone: iOS shows black without
    them. One fixed image per screen size, the mark where #splash draws it. -->
    <link rel="apple-touch-startup-image" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/splash-1320x2868.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/splash-1206x2622.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/splash-1290x2796.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/splash-1179x2556.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/splash-1284x2778.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/splash-1170x2532.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/splash-1125x2436.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/splash-1242x2688.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="/splash/splash-828x1792.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="/splash/splash-750x1334.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/splash-1242x2208.png" />
    <style>
      /* Installed-app splash: takes over from the launch image at the same spot,
      draws the wordmark, then fades onto the page. Hidden in the browser. */
      #splash { position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; background: #fff; transition: opacity .45s ease, transform .45s ease; }
      #splash .mark { display: grid; justify-items: center; gap: 18px; transform: translateY(23px); animation: k-rise .7s cubic-bezier(.2,.7,.2,1) .15s forwards; }
      #splash img { width: 88px; height: 88px; }
      #splash .name { font: 600 26px/1 'Newsreader', 'Iowan Old Style', Georgia, serif; color: #0F2A3A; opacity: 0; animation: k-fade .5s ease .45s forwards; }
      #splash .rule { width: 100%; height: 2px; background: #7A1F2B; transform: scaleX(0); transform-origin: left; animation: k-draw .55s cubic-bezier(.6,0,.2,1) .7s forwards; }
      #splash.out { opacity: 0; transform: scale(1.03); pointer-events: none; }
      @keyframes k-rise { to { transform: translateY(0); } }
      @keyframes k-fade { to { opacity: 1; } }
      @keyframes k-draw { to { transform: scaleX(1); } }
      @media (prefers-reduced-motion: reduce) { #splash .mark, #splash .name, #splash .rule { animation: none; transform: none; opacity: 1; } }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true"><div class="mark"><img src="/icons/icon-512.png" alt="" /><div><div class="name">Le Kiosque</div><div class="rule"></div></div></div></div>
    <script>
      // Only the installed app gets the splash; in a browser tab it would just delay the page
      (function () {
        var el = document.getElementById('splash');
        var standalone = window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;
        if (!standalone) { el.remove(); window.__kiosqueReady = function () {}; return; }
        var start = Date.now();
        var hold = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 300 : 1350;
        // Back from an article (iOS relaunches the app, see utils/resume.js): no long logo again
        try {
          var point = JSON.parse(localStorage.getItem('lekiosque_resume') || 'null');
          if (point && Date.now() - point.at < 30 * 60 * 1000) hold = 300;
        } catch (e) { /* storage unavailable */ }
        window.__kiosqueReady = function () {
          setTimeout(function () {
            el.classList.add('out');
            setTimeout(function () { el.remove(); }, 500);
          }, Math.max(0, hold - (Date.now() - start)));
        };
      })();
    </script>
    <script>
      // Chrome's install dialog is offered once, often before the app has loaded: keep it for
      // the install page and banner (useInstall), instead of Chrome's own mini bar
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__kiosqueInstall = e;
        window.dispatchEvent(new Event('kiosque-installable'));
      });
    </script>
    <!-- Visitor statistics (Umami, stats.hodologic.fr): no cookies, production only.
    The app routes by #hash, which the tracker neither follows nor records: each
    change of rubrique counts as a page view, filed under its path (#/editions as
    /editions). The tag says whether the visit is in the browser or the installed app. -->
    <script>
      (function () {
        window.__kiosqueStats = function (type, payload) {
          var view = location.hash.replace(/^#\/?/, '').split('?')[0];
          if (view && payload.url) payload.url = location.origin + '/' + view;
          return payload;
        };
        var app = window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;
        var s = document.createElement('script');
        s.defer = true;
        s.src = 'https://stats.hodologic.fr/k.js';
        s.dataset.websiteId = '7fd5d389-56b5-46e4-b114-63b2dfc6892a';
        s.dataset.domains = 'lekiosque.hodologic.fr';
        s.dataset.beforeSend = '__kiosqueStats';
        s.dataset.tag = app ? 'application' : 'navigateur';
        document.head.appendChild(s);
        window.addEventListener('hashchange', function () { if (window.umami) window.umami.track(); });
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
