# Le Kiosque — static SPA + reverse proxy to the FastAPI container.

upstream kiosque_api {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reports stream token-by-token and PDFs are generated on the fly; a 20 MB
    # corpus export is a normal response here. Defaults are far too tight.
    client_max_body_size 25m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    # ---------------------------------------------------------------- API ---
    location /api/ {
        # Trailing slash on both sides strips the /api prefix, matching the
        # rewrite() in vite.config.js — the API itself is mounted at root.
        proxy_pass http://kiosque_api/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # slowapi rate-limits per client IP; without these every visitor would
        # share nginx's container IP and trip one another's limits.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /answer streams the LLM response — buffering would hold the whole
        # generation back and defeat the incremental UI.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ------------------------------------------------------------- assets ---
    # Vite emits content-hashed filenames, so these are safe to pin forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The corpus export is bind-mounted and changes on every pipeline run —
    # revalidate rather than serve a stale 20 MB blob.
    location = /data.json {
        add_header Cache-Control "no-cache";
    }

    # The service worker must never be cached, or clients pin an old build.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    # --------------------------------------------------------------- SPA ---
    location / {
        try_files $uri $uri/ /index.html;
    }
}
